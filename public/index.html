<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudTasks</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#222}
.w{max-width:720px;margin:auto}
h1{margin:0 0 16px}
.c{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
form{display:flex;gap:8px}
input{flex:1;padding:10px;border:1px solid #ccd;border-radius:6px}
button{padding:10px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}
li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee;list-style:none}
ul{padding:0;margin:12px 0 0}
li span{flex:1}
li.d span{text-decoration:line-through;color:#999}
li button{background:#e11d48;padding:4px 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.g div{background:#f1f5f9;padding:10px;border-radius:6px;font-size:13px}
.g b{display:block;font-size:15px;margin-top:2px}
</style>
</head>
<body>
<div class="w">
<h1>CloudTasks</h1>
<div class="c">
<form id="f"><input id="t" placeholder="New task" autocomplete="off"><button>Add</button></form>
<ul id="l"></ul>
</div>
<div class="c">
<h3 style="margin-top:0">Server Info</h3>
<div class="g" id="i"></div>
</div>
</div>
<script>
const $ = id => document.getElementById(id);
const api = (u, o) => fetch(u, o).then(r => (r.status === 204 ? null : r.json()));

async function tasks() {
  const d = await api('/api/tasks');
  $('l').innerHTML = '';
  d.forEach(t => {
    const li = document.createElement('li');
    li.className = t.done ? 'd' : '';
    li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''} style="flex:none"><span>${t.title.replace(/</g, '&lt;')}</span><button>Delete</button>`;
    li.querySelector('input').onchange = () => api('/api/tasks/' + t.id, { method: 'PATCH' }).then(tasks);
    li.querySelector('button').onclick = () => api('/api/tasks/' + t.id, { method: 'DELETE' }).then(tasks);
    $('l').appendChild(li);
  });
}

async function info() {
  const s = await api('/api/info');
  const mb = x => Math.round(x / 1048576) + ' MB';
  const rows = [
    ['Hostname', s.hostname],
    ['Platform', s.platform],
    ['Node', s.node],
    ['vCPUs', s.cpus],
    ['Load (1m)', s.load.toFixed(2)],
    ['Memory', mb(s.totalMem - s.freeMem) + ' / ' + mb(s.totalMem)],
    ['Uptime', Math.round(s.uptime / 60) + ' min']
  ];
  $('i').innerHTML = rows.map(r => `<div>${r[0]}<b>${r[1]}</b></div>`).join('');
}

$('f').onsubmit = async e => {
  e.preventDefault();
  const title = $('t').value;
  $('t').value = '';
  await api('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
  tasks();
};

tasks();
info();
setInterval(info, 5000);
</script>
</body>
</html>
